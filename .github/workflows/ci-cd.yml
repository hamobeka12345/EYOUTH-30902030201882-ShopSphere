name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || github.ref == 'refs/heads/develop' && 'development' || 'staging' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install backend dependencies
        working-directory: ./backend
        run: npm ci

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build frontend
        working-directory: ./frontend
        run: npm run build
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_REVIEW_SERVICE_URL: ${{ vars.VITE_REVIEW_SERVICE_URL }}

      - name: Deploy frontend to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: team_fD7XqvKuczK1sDWxGw4q8Qqa
          vercel-project-id: prj_0X4ETYGcVEZrQTrww0A3Qvm8dSFu
          working-directory: ./frontend
          vercel-args: ${{ github.ref == 'refs/heads/main' && '--prod' || '' }}

      - name: Deploy backend to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: team_fD7XqvKuczK1sDWxGw4q8Qqa
          vercel-project-id: prj_aTQxTQsHYQSn8EsX9bPEmPUMzeJu
          working-directory: ./backend
          vercel-args: ${{ github.ref == 'refs/heads/main' && '--prod' || '' }}

      - name: Deploy review service to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: team_fD7XqvKuczK1sDWxGw4q8Qqa
          vercel-project-id: prj_S8s9i4dSdeXEEPSm0zcTlzKZpnbS
          working-directory: ./review-service
          vercel-args: ${{ github.ref == 'refs/heads/main' && '--prod' || '' }}
