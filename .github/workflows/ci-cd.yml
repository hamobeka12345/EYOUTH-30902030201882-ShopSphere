name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop, staging ]
  pull_request:
    branches: [ main, develop, staging ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: ${{ 
      github.ref == 'refs/heads/main' && 'production' || 
      github.ref == 'refs/heads/staging' && 'staging' || 
      'development' 
    }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install backend dependencies
        working-directory: ./backend
        run: npm ci

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build frontend
        working-directory: ./frontend
        run: npm run build

      - name: Install latest Vercel CLI
        run: npm install -g vercel@latest

      - name: Deploy frontend to Vercel
        run: |
          if [ "${{ github.ref }}" == "refs/heads/main" ]; then
            vercel deploy --yes --force --token=${{ secrets.VERCEL_TOKEN }} --project=eyouth-30902030201882-shopsphere-frontend --prod
          else
            vercel deploy --yes --force --token=${{ secrets.VERCEL_TOKEN }} --project=eyouth-30902030201882-shopsphere-frontend
          fi
        working-directory: ./frontend
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Deploy backend to Vercel
        run: |
          if [ "${{ github.ref }}" == "refs/heads/main" ]; then
            vercel deploy --yes --force --token=${{ secrets.VERCEL_TOKEN }} --project=eyouth-30902030201882-shopsphere-backend --prod
          else
            vercel deploy --yes --force --token=${{ secrets.VERCEL_TOKEN }} --project=eyouth-30902030201882-shopsphere-backend
          fi
        working-directory: ./backend
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
