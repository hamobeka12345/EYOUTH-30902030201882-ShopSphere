name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || github.ref == 'refs/heads/develop' && 'development' || 'staging' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install backend dependencies
        working-directory: ./backend
        run: npm ci

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build frontend
        working-directory: ./frontend
        run: npm run build

      - name: Install latest Vercel CLI
        run: npm install -g vercel@latest

      - name: Deploy frontend to Vercel
        run: vercel deploy --yes --token=${{ secrets.VERCEL_TOKEN }} --project=prj_0X4ETYGcVEZrQTrww0A3Qvm8dSFu --cwd=./frontend ${{ github.ref == 'refs/heads/main' && '--prod' || '' }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Deploy backend to Vercel
        run: vercel deploy --yes --token=${{ secrets.VERCEL_TOKEN }} --project=prj_aTQxTQsHYQSn8EsX9bPEmPUMzeJu --cwd=./backend ${{ github.ref == 'refs/heads/main' && '--prod' || '' }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Deploy review service to Vercel
        run: vercel deploy --yes --token=${{ secrets.VERCEL_TOKEN }} --project=prj_S8s9i4dSdeXEEPSm0zcTlzKZpnbS --cwd=./review-service ${{ github.ref == 'refs/heads/main' && '--prod' || '' }}
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
