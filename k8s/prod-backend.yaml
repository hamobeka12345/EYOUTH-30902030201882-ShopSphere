apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: shopsphere-prod
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: backend
        image: node:20-alpine
        command: ["node", "src/index.js"]
        workingDir: /app
        ports:
        - containerPort: 5000
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: shopsphere-secrets
              key: database-url
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: shopsphere-secrets
              key: jwt-secret
        volumeMounts:
        - name: backend-source
          mountPath: /app
      volumes:
      - name: backend-source
        configMap:
          name: backend-source
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: shopsphere-prod
spec:
  selector:
    app: backend
  ports:
  - port: 5000
    targetPort: 5000
  type: ClusterIP
