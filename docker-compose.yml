services:
  db:
    image: postgres:15
    container_name: ecommerce_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Kmjaj2009@
      POSTGRES_DB: ecommerce
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ecommerce"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: ecommerce_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:Kmjaj2009%40@db:5432/ecommerce?schema=public
      JWT_SECRET: supersecretkey
      PORT: 5000
    ports:
      - "5000:5000"
    command: sh -c "npx prisma migrate deploy && node prisma/seed.js && npm start"

  frontend:
    build:
      context: ./frontend
    container_name: ecommerce_frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      VITE_API_URL: http://backend:5000
    ports:
      - "3000:3000"

volumes:
  pgdata:
